# Contact Page / Form Locators

contact.form.loc={"locator":"xpath=//form","desc":"Contact Form"}
contact.firstname.field.loc={"locator":"name=fname","desc":"First Name Input Field"}
contact.lastname.field.loc={"locator":"name=lname","desc":"Last Name Input Field"}
contact.email.field.loc={"locator":"name=email","desc":"Email Input Field"}
contact.company.field.loc={"locator":"name=company","desc":"Company Input Field"}
contact.service.field.loc={"locator":"name=service","desc":"Service Interest Select"}
contact.message.field.loc={"locator":"name=message","desc":"Message Textarea"}
contact.submit.button.loc={"locator":"xpath=//form//button[@type='submit']","desc":"Submit Button"}
contact.success.message.loc={"locator":"xpath=//*[contains(text(),'Thank you') or contains(text(),'success') or contains(@class,'success')]","desc":"Success Message"}
contact.error.message.loc={"locator":"xpath=//*[contains(@class,'error') or contains(@class,'invalid') or contains(text(),'required')]","desc":"Error/Validation Message"}
