# Contact Page / Form Locators

contact.form                = {"locator":"xpath=//form[contains(@class,'contact') or contains(@id,'contact')]  | //form","desc":"Contact Form"}
contact.name.field          = {"locator":"xpath=//input[@name='name' or @placeholder='Name' or @id='name']","desc":"Name Input Field"}
contact.email.field         = {"locator":"xpath=//input[@name='email' or @type='email' or @placeholder='Email' or @id='email']","desc":"Email Input Field"}
contact.phone.field         = {"locator":"xpath=//input[@name='phone' or @type='tel' or @placeholder='Phone' or @id='phone']","desc":"Phone Input Field"}
contact.message.field       = {"locator":"xpath=//textarea[@name='message' or @placeholder='Message' or @id='message']","desc":"Message Textarea"}
contact.subject.field       = {"locator":"xpath=//input[@name='subject' or @placeholder='Subject' or @id='subject']","desc":"Subject Input Field"}
contact.submit.button       = {"locator":"xpath=//form//button[@type='submit'] | //form//input[@type='submit']","desc":"Submit Button"}
contact.success.message     = {"locator":"xpath=//*[contains(text(),'Thank you') or contains(text(),'success') or contains(@class,'success')]","desc":"Success Message"}
contact.error.message       = {"locator":"xpath=//*[contains(@class,'error') or contains(@class,'invalid') or contains(text(),'required')]","desc":"Error/Validation Message"}
