# Navigation Locators

nav.menu.loc={"locator":"xpath=//nav | //header//ul","desc":"Navigation Menu"}
nav.menu.home.loc={"locator":"xpath=//nav//a[@href='#home'] | //header//a[@href='#home']","desc":"Home Menu Item"}
nav.menu.about.loc={"locator":"xpath=//nav//a[@href='#about'] | //header//a[@href='#about']","desc":"About Menu Item"}
nav.menu.services.loc={"locator":"xpath=//nav//a[@href='#services'] | //header//a[@href='#services']","desc":"Services Menu Item"}
nav.menu.contact.loc={"locator":"xpath=//nav//a[@href='#contact'] | //header//a[@href='#contact']","desc":"Contact Menu Item"}
nav.hamburger.loc={"locator":"xpath=//button[contains(@class,'hamburger') or contains(@class,'menu-toggle') or contains(@class,'navbar-toggler')]","desc":"Mobile Hamburger Menu"}

# Section heading locators — used to verify bookmark navigation landed on correct section
nav.section.about.loc={"locator":"xpath=//*[@id='about']//h2 | //*[@id='about']//h1","desc":"About Section Heading"}
nav.section.services.loc={"locator":"xpath=//*[@id='services']//h2 | //*[@id='services']//h1","desc":"Services Section Heading"}
nav.section.contact.loc={"locator":"xpath=//*[@id='contact']//h2 | //*[@id='contact']//h1","desc":"Contact Section Heading"}
