# Navigation Locators

nav.menu                    = {"locator":"xpath=//nav | //header//ul","desc":"Navigation Menu"}
nav.menu.home               = {"locator":"xpath=//nav//a[contains(text(),'Home')] | //header//a[contains(text(),'Home')]","desc":"Home Menu Item"}
nav.menu.about              = {"locator":"xpath=//nav//a[contains(text(),'About')] | //header//a[contains(text(),'About')]","desc":"About Menu Item"}
nav.menu.services           = {"locator":"xpath=//nav//a[contains(text(),'Services')] | //header//a[contains(text(),'Services')]","desc":"Services Menu Item"}
nav.menu.portfolio          = {"locator":"xpath=//nav//a[contains(text(),'Portfolio') or contains(text(),'Work')] | //header//a[contains(text(),'Portfolio')]","desc":"Portfolio Menu Item"}
nav.menu.contact            = {"locator":"xpath=//nav//a[contains(text(),'Contact')] | //header//a[contains(text(),'Contact')]","desc":"Contact Menu Item"}
nav.hamburger               = {"locator":"xpath=//button[contains(@class,'hamburger') or contains(@class,'menu-toggle') or contains(@class,'navbar-toggler')]","desc":"Mobile Hamburger Menu"}
