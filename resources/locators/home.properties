# Home Page Locators

# Header / Hero Section
home.logo.loc={"locator":"xpath=//img[contains(@alt,'Matrix') or contains(@class,'logo')]","desc":"Matrix Logo"}
home.hero.heading.loc={"locator":"xpath=(//h1)[1]","desc":"Hero Heading"}
home.hero.cta.button.loc={"locator":"xpath=//a[@href='#contact']","desc":"Hero CTA Button"}

# Services Section
home.services.section.loc={"locator":"id=services","desc":"Services Section"}
home.services.heading.loc={"locator":"xpath=//*[@id='services']//h2","desc":"Services Heading"}

# About Section
home.about.section.loc={"locator":"id=about","desc":"About Section"}
home.about.heading.loc={"locator":"xpath=//*[@id='about']//h2","desc":"About Heading"}

# Contact Section
home.contact.section.loc={"locator":"id=contact","desc":"Contact Section"}

# Footer
home.footer.loc={"locator":"xpath=//footer","desc":"Footer"}
home.footer.copyright.loc={"locator":"xpath=//footer//*[contains(text(),'Matrix') or contains(text(),'©')]","desc":"Footer Copyright"}
