# Home Page Locators

# Header / Hero Section
home.logo.loc={"locator":"xpath=//img[contains(@alt,'Matrix') or contains(@class,'logo')]","desc":"Matrix Logo"}
home.hero.heading.loc={"locator":"xpath=(//h1)[1]","desc":"Hero Heading"}
home.hero.cta.button.loc={"locator":"xpath=//a[contains(text(),'Get Started') or contains(text(),'Contact Us') or contains(text(),'Let') ]","desc":"Hero CTA Button"}

# Services Section
home.services.section.loc={"locator":"xpath=//*[contains(@id,'services') or contains(@class,'services')]","desc":"Services Section"}
home.services.heading.loc={"locator":"xpath=//section[contains(@id,'services') or contains(@class,'service')]//h2","desc":"Services Heading"}

# About Section
home.about.section.loc={"locator":"xpath=//*[contains(@id,'about') or contains(@class,'about')]","desc":"About Section"}
home.about.heading.loc={"locator":"xpath=//section[contains(@id,'about') or contains(@class,'about')]//h2","desc":"About Heading"}

# Technologies Section
home.tech.section.loc={"locator":"xpath=//*[contains(@id,'technologies') or contains(@class,'tech')]","desc":"Technologies Section"}

# Clients / Portfolio Section
home.clients.section.loc={"locator":"xpath=//*[contains(@id,'clients') or contains(@class,'client') or contains(@class,'portfolio')]","desc":"Clients Section"}

# Footer
home.footer.loc={"locator":"xpath=//footer","desc":"Footer"}
home.footer.copyright.loc={"locator":"xpath=//footer//*[contains(text(),'Matrix') or contains(text(),'©')]","desc":"Footer Copyright"}
